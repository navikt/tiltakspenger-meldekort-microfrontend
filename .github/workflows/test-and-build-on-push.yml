name: Test/build on feature branch push

# Fork-PR-er: pushes i forks trigger aldri workflows i base-repoet, derfor pull_request-trigger i tillegg.
# Delt workflow skipper selv interne PR-events (dekkes av push-triggeren).
# dev-*-brancher bygges av deploy.yaml (dev-deploy), så de ekskluderes her for å unngå dobbeltbygg.
on:
  push:
    branches-ignore:
      - main
      - 'dev-*'
    paths-ignore:
      - '**.md'
      - '.env-template'
      - '.gitattributes'
      - '.gitignore'
      - '.husky/**'
      - 'CODEOWNERS'
      - 'docker-compose/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.env-template'
      - '.gitattributes'
      - '.gitignore'
      - '.husky/**'
      - 'CODEOWNERS'
      - 'docker-compose/**'
      - 'LICENSE'

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  build:
    name: Test and build
    # Delt workflow i metarepoet, se https://github.com/navikt/tiltakspenger/blob/main/.github/workflows/README.md
    uses: navikt/tiltakspenger/.github/workflows/test-og-bygg-node.yml@main
    permissions:
      contents: read
    with:
      # Repoet har verken lint- eller test-script; `build` = `astro check && astro build` er den eneste kvalitetsgaten.
      kommando: '"$PAKKEHANDTERER" run build'
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      SLACK_VARSEL_WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}
