# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# esbuild:    bundleren Astro/Vite bruker, henter/verifiserer den plattformspesifikke binæren
# sharp:      native bildebehandling brukt av Astros bildeoptimalisering
# protobufjs: postinstall genererer kun ekstra CLI-filer vi ikke bruker - eksplisitt av,
#             slik at pnpm ikke feiler installasjonen med ERR_PNPM_IGNORED_BUILDS
allowBuilds:
  esbuild: true
  protobufjs: false
  sharp: true

# Unntak fra 7-dagers cooldown (minimumReleaseAge). Cooldown er et bevisst supply-chain-mottiltak,
# men den holder også igjen ferske sikkerhetsfikser. Her veier fiksen tyngre enn ventetiden.
# brace-expansion: GHSA-mh99-v99m-4gvg (HIGH, DoS via ubegrenset ekspansjon). Fiksen kom i 1.1.17
#                  2026-07-29; uten unntaket faller resolvingen tilbake til sårbare 1.1.16.
# Fjern oppføringen når 1.1.17 har passert cooldown av seg selv.
minimumReleaseAgeExclude:
  - brace-expansion
