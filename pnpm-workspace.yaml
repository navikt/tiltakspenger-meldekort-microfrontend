# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# esbuild:    bundleren Astro/Vite bruker, henter/verifiserer den plattformspesifikke binæren
# sharp:      native bildebehandling brukt av Astros bildeoptimalisering
# protobufjs: postinstall genererer kun ekstra CLI-filer vi ikke bruker - eksplisitt av,
#             slik at pnpm ikke feiler installasjonen med ERR_PNPM_IGNORED_BUILDS
allowBuilds:
  esbuild: true
  protobufjs: false
  sharp: true

# 7 dagers cooldown før nye versjoner tas i bruk - samme supply-chain-mottiltak som
# Dependabot-configen (.github/dependabot.yml), jf. tj-actions-hendelsen. Verdien er i minutter.
# Ligger i repoet slik at regelen gjelder alle som regenererer lockfila, ikke bare lokale maskiner.
# Trengs et unntak for en fersk sikkerhetsfiks, bruk minimumReleaseAgeExclude med begrunnelse.
minimumReleaseAge: 10080
# Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
minimumReleaseAgeExclude:
  - "@navikt/*"
  - "@nais/*"
